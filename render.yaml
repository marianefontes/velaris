services:
  - type: web
    name: aetheris-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aetheris-bz9q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: beatrice-chat-server
    runtime: python
    # API embeddings avoid loading BGE-M3 locally; Standard (2GB) is enough.
    plan: standard
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: RESEARCH_ADMIN_KEY
        generateValue: true
      # CORS: "*" keeps the public prototype open. Set to the frontend origin
      # (e.g. https://aetheris-app.onrender.com) to lock it down later.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AETHERIS_EMBEDDING_MODE
        value: api
      - key: AETHERIS_EMBEDDING_MODEL
        value: BAAI/bge-m3
      # ChromaDB + SQLite paths auto-detect /var/data when the disk below is mounted.
      # Do not hardcode CHROMA_DB_PATH here — an unmounted disk would crash startup.
      - key: LABORATORY_AUTOMATION_ENABLED
        value: "true"
      - key: LABORATORY_SCHEDULE_TIMEZONE
        value: Europe/Lisbon
      - key: LABORATORY_AUTOMATION_CASE_SET
        value: beatrice-core-v1
      - key: LABORATORY_GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: LABORATORY_REQUEST_INTERVAL_SECONDS
        value: "13"
      - key: LABORATORY_RATE_LIMIT_RETRIES
        value: "6"
    disk:
      name: aetheris-research-data
      mountPath: /var/data
      sizeGB: 5
