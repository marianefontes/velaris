services:
  - type: web
    name: aetheris-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aetheris-bz9q.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: beatrice-chat-server
    runtime: python
    # BGE-M3 + ChromaDB need >512MB RAM; Standard (2GB) is the minimum viable plan.
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: RESEARCH_ADMIN_KEY
        generateValue: true
      # CORS: "*" keeps the public prototype open. Set to the frontend origin
      # (e.g. https://aetheris-app.onrender.com) to lock it down later.
      - key: ALLOWED_ORIGINS
        value: "*"
      # Persist the vector index and the BGE-M3 download on the mounted disk so
      # the corpus bootstrap and model download happen once, not per restart.
      - key: CHROMA_DB_PATH
        value: /var/data/chroma_db
      - key: HF_HOME
        value: /var/data/hf_cache
      - key: STUDY_DB_PATH
        value: /var/data/aetheris-study.sqlite3
      - key: LABORATORY_DB_PATH
        value: /var/data/aetheris-laboratory.sqlite3
      - key: LABORATORY_AUTOMATION_ENABLED
        value: "true"
      - key: LABORATORY_SCHEDULE_TIMEZONE
        value: Europe/Lisbon
      - key: LABORATORY_AUTOMATION_CASE_SET
        value: beatrice-core-v1
      - key: LABORATORY_GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: LABORATORY_REQUEST_INTERVAL_SECONDS
        value: "13"
      - key: LABORATORY_RATE_LIMIT_RETRIES
        value: "6"
    disk:
      name: aetheris-research-data
      mountPath: /var/data
      sizeGB: 5
